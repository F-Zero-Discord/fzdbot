[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fzdbot"
version = "0.2.0"
description = "A Discord bot for tracking and displaying scores, integrated with a database"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Nightmare", email = "tromnick@yahoo.com" }]
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.0",
    "aiomysql>=0.2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "cryptography",
    "aiohttp>=3.10",
]

[project.scripts]
fzdbot = "fzdbot.main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=8.0",
    "ruff>=0.6.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fzdbot"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.ruff]
target-version = "py312"
line-length = 114
extend-exclude = [
    ".venv",
    ".uv-cache",
    ".ruff_cache",
    ".pytest_cache",
    "__pycache__",
]
